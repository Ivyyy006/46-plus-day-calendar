<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Coverage Start Date — 46+ Day Calendar</title>
  <style>
    :root {font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#24262c; background:#fff; color-scheme:light;}
    * { box-sizing:border-box; }
    body { margin:0; padding:2px 3px 8px; }
    .calendar {max-width:390px; margin:0 auto;}
    .topline {margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
    .header { display:flex; align-items:center; gap:9px; margin:0; font-size:17px; font-weight:650; letter-spacing:-.25px; }
    .nav {display:flex; gap:4px;}
    button {font:inherit;}
    .nav button {display:grid; place-items:center; cursor:pointer; border:1px solid #e1e4ea; background:white; color:#343a43; border-radius:9px; width:37px; height:37px;}
    .nav button:hover:not(:disabled) {background:#f4f5f8;}
    .nav button:disabled {opacity:.25; cursor:not-allowed;}
    .nav button:focus-visible,.day:focus-visible,.clear:focus-visible {outline:3px solid #6d83c7; outline-offset:2px;}
    .weekdays,.days {display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px;}
    .weekdays span {text-align:center; color:#767e8b; font-size:12px; font-weight:600; padding:8px 0;}
    .day { height:43px; border:0; border-radius:9px; background:transparent; color:#282d37; font-size:14px; cursor:pointer;}
    .day:hover:not(:disabled) {background:#eef2ff;}
    .day:disabled { color:#c3c6cc; cursor:default;}
    .day.selected {background:#324e8f; color:white; font-weight:700;}
    .day.selected:hover {background:#263e76;}
    .day.today:not(.selected) {box-shadow:inset 0 0 0 1px #a4abb9;}
    .empty {height:43px;}
    .selection {display:flex; justify-content:space-between; align-items:center; margin-top:15px; padding:11px 12px; background:#f6f7fa; border-radius:9px; gap:12px; min-height:46px;}
    .selected-label {font-size:13px; color:#535b66; line-height:1.4;}
    .selected-label strong {color:#20242a; font-weight:650;}
    .clear {background:none; border:none; cursor:pointer; padding:5px; color:#334f8b; font-weight:600; font-size:12px;}
    .hint {margin:10px 0 0; font-size:12px; color:#727986; line-height:1.4;}
    .error {margin-top:8px; font-size:12px; color:#aa2740; min-height:0;}
    @media (max-width:350px) { .day,.empty {height:38px;} .header {font-size:16px;} }
  </style>
  <!-- The official Jotform bridge is needed when this page runs as a registered widget. -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
</head>
<body>
  <main class="calendar" aria-label="Preferred coverage start date calendar">
    <div class="topline">
      <h2 class="header" id="monthLabel" aria-live="polite"></h2>
      <div class="nav" aria-label="Calendar navigation">
        <button type="button" id="prev" aria-label="Previous month" title="Previous month">&#8249;</button>
        <button type="button" id="next" aria-label="Next month" title="Next month">&#8250;</button>
      </div>
    </div>
    <div class="weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="days" id="days" role="group" aria-label="Choose a coverage start date"></div>
    <div class="selection">
      <div id="selection" class="selected-label" aria-live="polite">No date selected</div>
      <button type="button" id="clear" class="clear" hidden>Clear</button>
    </div>
    <p class="hint" id="hint">Select a date to continue. Only dates at least 46 days from today are available.</p>
    <div class="error" id="error" role="alert" aria-live="polite"></div>
  </main>
<script>
(function () {
  'use strict';
  // Rolling restriction is based on the visitor's LOCAL calendar date.
  // Using Date(y,m,d+46) handles month/year and daylight saving transitions.
  const OFFSET_DAYS = 46;
  const daysContainer = document.getElementById('days');
  const monthLabel = document.getElementById('monthLabel');
  const selectionLabel = document.getElementById('selection');
  const errorLabel = document.getElementById('error');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const clear = document.getElementById('clear');
  const dayFormatter = new Intl.DateTimeFormat('en-US', {weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const monthFormatter = new Intl.DateTimeFormat('en-US', {month:'long',year:'numeric'});

  function atMidnight(d) { return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  function datePlusDays(date,days) { return new Date(date.getFullYear(),date.getMonth(),date.getDate()+days); }
  function localISO(date) { return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'); }
  function parseISO(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    const [y,m,d] = value.split('-').map(Number);
    const date = new Date(y,m-1,d);
    return localISO(date)===value ? date : null;
  }
  function minDate() {return datePlusDays(atMidnight(new Date()), OFFSET_DAYS);}
  function sameMonth(a,b) {return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();}
  function before(a,b) {return a.getTime()<b.getTime();}
  let shown = new Date(minDate().getFullYear(), minDate().getMonth(), 1);
  let picked = null;
  let isJotformReady = false;

  function jotformData() {
    if (!isJotformReady || !window.JFCustomWidget) return;
    JFCustomWidget.sendData({valid:!!picked && !before(picked,minDate()), value:picked ? localISO(picked) : ''});
  }
  function selectDate(date) {
    if (before(date,minDate())) return;
    picked = date;
    errorLabel.textContent = '';
    jotformData();
    draw();
  }
  function draw() {
    const min = minDate();
    // If the widget stays open past midnight, discard a selection that becomes invalid.
    if (picked && before(picked,min)) {picked=null; jotformData();}
    // Do not allow the view to navigate to months entirely before the minimum.
    const minMonth = new Date(min.getFullYear(),min.getMonth(),1);
    if (before(shown,minMonth)) shown=minMonth;
    monthLabel.textContent=monthFormatter.format(shown);
    prev.disabled = sameMonth(shown,minMonth);
    daysContainer.replaceChildren();
    const firstWeekday=(shown.getDay()+6)%7; // Monday-first calendar
    const count=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();
    const today=atMidnight(new Date());
    for(let i=0;i<firstWeekday;i++) {
      const spacer=document.createElement('div'); spacer.className='empty'; spacer.setAttribute('aria-hidden','true'); daysContainer.appendChild(spacer);
    }
    for(let day=1;day<=count;day++) {
      const date=new Date(shown.getFullYear(),shown.getMonth(),day);
      const btn=document.createElement('button');
      btn.type='button'; btn.className='day'; btn.textContent=String(day);
      btn.setAttribute('aria-label',dayFormatter.format(date));
      btn.disabled=before(date,min);
      if (localISO(date)===localISO(today)) btn.classList.add('today');
      if (picked && localISO(date)===localISO(picked)) {
        btn.classList.add('selected'); btn.setAttribute('aria-pressed','true');
      } else btn.setAttribute('aria-pressed','false');
      btn.addEventListener('click',function(){selectDate(date);});
      daysContainer.appendChild(btn);
    }
    selectionLabel.replaceChildren();
    if(picked) {
      const strong=document.createElement('strong'); strong.textContent=dayFormatter.format(picked);
      selectionLabel.appendChild(strong);
    } else selectionLabel.textContent='No date selected';
    clear.hidden=!picked;
    resize();
  }
  function resize() {
    if(!isJotformReady || !window.JFCustomWidget) return;
    // Six-week months can need a little more height than four-week months.
    const height = Math.ceil(document.documentElement.scrollHeight)+12;
    JFCustomWidget.requestFrameResize({height: Math.max(height,360)});
  }
  prev.addEventListener('click',function(){shown=new Date(shown.getFullYear(),shown.getMonth()-1,1); draw();});
  next.addEventListener('click',function(){shown=new Date(shown.getFullYear(),shown.getMonth()+1,1); draw();});
  clear.addEventListener('click',function(){picked=null; jotformData(); draw();});

  // Works as a local demo (without Jotform), and as an actual Jotform iFrame Widget.
  draw();
  if(window.JFCustomWidget && typeof JFCustomWidget.subscribe==='function') {
    JFCustomWidget.subscribe('ready',function(data){
      isJotformReady=true;
      // Restore an existing selection only when editing a saved submission.
      const saved=parseISO(data && data.value);
      if(saved && !before(saved,minDate())) {
        picked=saved;
        shown=new Date(saved.getFullYear(),saved.getMonth(),1);
      }
      draw();
      jotformData();
      JFCustomWidget.subscribe('submit',function(){
        const valid=!!picked && !before(picked,minDate());
        if(!valid) errorLabel.textContent='Please choose your preferred coverage start date.';
        JFCustomWidget.sendSubmit({valid:valid,value:valid?localISO(picked):''});
        resize();
      });
    });
  }
})();
</script>
</body>
</html>
